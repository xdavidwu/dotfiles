<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>
	<match>
		<test name="lang">
			<string>und-zsye</string>
		</test>
		<test qual="all" name="color" compare="not_eq">
			<bool>true</bool>
		</test>
		<test qual="all" name="color" compare="not_eq">
			<bool>false</bool>
		</test>
		<edit name="color" mode="append">
			<bool>false</bool>
		</edit>
	</match>
	<match target="font">
		<test name="family">
			<string>Noto Sans Mono CJK TC</string>
		</test>
		<edit name="pixelsize" mode="assign">
			<times>
				<name>pixelsize</name>
				<double>0.95</double>
			</times>
		</edit>
	</match>
	<match target="font">
		<test name="family">
			<string>Noto Sans CJK TC</string>
		</test>
		<edit name="pixelsize" mode="assign">
			<times>
				<name>pixelsize</name>
				<double>0.8</double>
			</times>
		</edit>
	</match>
	<match target="font">
		<test name="family">
			<string>Noto Sans Symbols2</string>
		</test>
		<edit name="pixelsize" mode="assign">
			<times>
				<name>pixelsize</name>
				<double>0.875</double>
			</times>
		</edit>
	</match>
</fontconfig>
